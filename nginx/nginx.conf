# nginx.conf — NHLBI Research Data Portal
# TLS configuration: enforce TLS 1.3 only (upgraded from TLS 1.2 minimum)
# Per NIST SP 800-52 Rev 2 and updated SC-8 policy

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with request_id for audit correlation (AU-3)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$request_id"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Disable TLS 1.0, 1.1, and 1.2 — enforce TLS 1.3 only
    # Previous configuration allowed TLS 1.2; this change enforces TLS 1.3
    ssl_protocols              TLSv1.3;
    ssl_prefer_server_ciphers  off;

    # TLS 1.3 cipher suites (IANA names)
    ssl_ciphers  TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;

    # HSTS — 1 year, includeSubDomains (SC-8, SC-12)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    server {
        listen       443 ssl;
        server_name  rdp.nhlbi.nih.gov;

        ssl_certificate      /etc/nginx/certs/server.crt;
        ssl_certificate_key  /etc/nginx/certs/server.key;

        # Session resumption (performance; TLS 1.3 handles this via PSK)
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;

        # Reject plain HTTP (should not reach nginx, but belt-and-suspenders)
        if ($scheme != "https") {
            return 301 https://$host$request_uri;
        }

        location / {
            proxy_pass         http://app:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-ID $request_id;

            # Timeout settings
            proxy_connect_timeout  10s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;
        }
    }

    # Redirect HTTP to HTTPS
    server {
        listen  80;
        server_name  rdp.nhlbi.nih.gov;
        return 301 https://$host$request_uri;
    }
}
