apiVersion: apps/v1
kind: Deployment
metadata:
  name: nhlbi-rdp
  namespace: nhlbi-prod
  labels:
    app: nhlbi-rdp
    env: production
    classification: moderate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nhlbi-rdp
  template:
    metadata:
      labels:
        app: nhlbi-rdp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/wilcore-tech/nhlbi-rdp:latest
          ports:
            - containerPort: 8080
          env:
            - name: IDP_ENTITY_ID
              valueFrom:
                secretKeyRef:
                  name: nhlbi-rdp-secrets
                  key: idp-entity-id
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nhlbi-rdp-secrets
                  key: jwt-secret-key
            - name: UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nhlbi-rdp-secrets
                  key: upstream-api-key
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
